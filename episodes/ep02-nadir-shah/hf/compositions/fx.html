</div>
<script>
(function(){
  var tl = gsap.timeline({ paused: true });
  // grain: jumps to a new seeded offset every 1/15 s, driven by the timeline (never CSS animation)
  var g = document.getElementById("fx-grain"), o = { v: 0 };

})();
